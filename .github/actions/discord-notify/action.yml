# Discord 웹훅으로 임베드 메시지 하나를 보낸다. 알림 실패는 워크플로 결과를 바꾸지 않는다.
# (민서님 이전 프로젝트 Webhook 레포의 _discord-notify.yml을 레포 안 부품으로 옮김)
name: discord-notify
description: Discord 웹훅 알림
inputs:
  webhook-url: {description: 웹훅 주소 (Secret), required: true}
  title: {description: 제목, required: true}
  description: {description: 본문, required: false, default: ""}
  color: {description: 색 (10진수), required: false, default: "3447003"}
  url: {description: 제목 링크, required: false, default: ""}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook-url }}
        TITLE: ${{ inputs.title }}
        DESC: ${{ inputs.description }}
        COLOR: ${{ inputs.color }}
        LINK: ${{ inputs.url }}
      run: |
        if [ -z "$WEBHOOK" ]; then echo "웹훅 주소가 없어 알림을 건너뜁니다."; exit 0; fi
        payload=$(jq -n --arg t "$TITLE" --arg d "$DESC" --arg u "$LINK" --argjson c "$COLOR" \
          '{embeds: [{title: $t, description: $d, url: (if $u == "" then null else $u end), color: $c}]}')
        curl -sS -m 10 -H "Content-Type: application/json" -d "$payload" "$WEBHOOK" >/dev/null \
          || echo "::warning::Discord 알림 전송 실패 (배포 결과에는 영향 없음)"
