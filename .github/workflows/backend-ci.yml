# 블로그 앱(app/backend) 빌드와 테스트. Testcontainers가 PostgreSQL 16·Redis 7을 직접 띄운다(GitHub 러너의 Docker 사용).
name: backend-ci

on:
  pull_request:
    paths:
      - "app/backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: 테스트
        run: ./mvnw -B -ntp verify
      - name: 실패한 테스트 보고서
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: app/backend/target/surefire-reports
