# 학교 공용 서버에 GitHub 러너(데이터센터)에서 새 TCP 연결이 되는지만 본다. 비밀값 없음.
name: 학교 서버 접속 점검
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/infra-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: TCP 접속
        run: |
          for t in s3.java21.net:8000 s4.java21.net:13306 s4.java21.net:5672 s4.java21.net:9200 s4.java21.net:9000 \
                   220.67.216.14:6379 storage.java21.net:80 storage.java21.net:9000 storage.java21.net:443; do
            h=${t%:*}; p=${t##*:}
            if timeout 8 bash -c "exec 3<>/dev/tcp/$h/$p" 2>/dev/null; then r=OPEN; else r=CLOSED; fi
            echo "$t $r"
          done
          echo "--- storage:80 HTTP 응답 머리"
          curl -sS -m 15 -o /dev/null -w '%{http_code} %{time_total}s\n' http://storage.java21.net/minio/health/live || true
