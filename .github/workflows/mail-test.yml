# Gmail 앱 비밀번호(Secret SMTP_PASSWORD)가 맞는지 시험 메일 1통으로 확인한다.
# 받는 사람은 보내는 계정 자신뿐이다. 비밀번호는 로그에 찍지 않는다.
# 수동 실행(Actions → 메일 시험 발송 → Run workflow). 이 파일을 고친 push에서도 한 번 돈다.
name: 메일 시험 발송

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/mail-test.yml']

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMTP_USERNAME: devlogauth@gmail.com
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - name: Gmail로 시험 메일 보내기
        shell: python
        run: |
          import os, smtplib, sys
          from datetime import datetime, timezone
          from email.message import EmailMessage

          user = os.environ["SMTP_USERNAME"]
          # 앱 비밀번호는 "abcd efgh ..."처럼 띄어 써서 복사되는 일이 많아 공백을 뺀다
          pw = os.environ.get("SMTP_PASSWORD", "").replace(" ", "").strip()
          if not pw:
              print("::error::Secret SMTP_PASSWORD가 비어 있습니다")
              sys.exit(1)
          print(f"비밀번호 길이 {len(pw)}자 (Gmail 앱 비밀번호는 16자)")

          msg = EmailMessage()
          msg["From"] = f"devlog <{user}>"
          msg["To"] = user
          msg["Subject"] = "devlog 메일 시험 발송"
          msg.set_content(f"GitHub Actions에서 보낸 시험 메일입니다. {datetime.now(timezone.utc).isoformat()}")

          try:
              with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as s:
                  s.starttls()
                  s.login(user, pw)
                  s.send_message(msg)
          except smtplib.SMTPAuthenticationError as e:
              print(f"::error::로그인 실패(인증 오류 {e.smtp_code}): 앱 비밀번호가 틀렸거나 2단계 인증이 꺼져 있습니다")
              sys.exit(1)
          except Exception as e:
              print(f"::error::발송 실패: {type(e).__name__}: {e}")
              sys.exit(1)
          print(f"성공: {user} 로 시험 메일을 보냈습니다")
