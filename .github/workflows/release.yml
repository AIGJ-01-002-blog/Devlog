# CHANGELOG.md 맨 위 버전으로 태그와 GitHub Release를 만든다. 이미 있는 태그면 아무것도 하지 않는다.
name: release

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 맨 위 버전과 노트 읽기
        id: notes
        run: |
          version=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          if [ -z "$version" ]; then echo "CHANGELOG.md에서 버전을 찾지 못했습니다" >&2; exit 1; fi
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 태그와 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION 태그가 이미 있습니다. 건너뜁니다."
            exit 0
          fi
          prerelease=""
          case "$VERSION" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md $prerelease
