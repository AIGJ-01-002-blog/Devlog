blog:
  dev-login:
    enabled: true
  cursor:
    secret: test-cursor-secret
  post:
    # 테스트는 자동 저장을 연달아 보내므로 간격 제한을 끈다 (제한 자체는 PostLimitsTest가 확인)
    autosave-min-interval: 0s
    # 예약 작업은 테스트가 직접 부른다
    autosave-flush-interval: 1h
    empty-draft-cleanup-cron: "-"
    trash-purge-cron: "-"
  view:
    flush-interval: 1h
  # 최근창을 줄여 인덱스 후보 경로도 시험한다 (014)
  # 알림은 같은 스레드에서 바로 만든다(결과를 기다리지 않게). 정리 작업은 테스트가 직접 부른다
  notification:
    cleanup-cron: "-"
  search:
    recent-window: 5
  media:
    profile-cleanup-cron: "-"
    post-image-cleanup-cron: "-"
logging:
  level:
    root: WARN
    com.team.blog: INFO
