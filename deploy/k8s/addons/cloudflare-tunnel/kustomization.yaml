# devlog.life를 Cloudflare Tunnel로 클러스터의 인그레스에 잇는다. 서버 쪽 포트를 열지 않아도 되고 https는 Cloudflare가 붙인다.
# 토큰(Secret cloudflared-token, 키 token)은 deploy.yml이 GitHub Secret CLOUDFLARE_TUNNEL_TOKEN으로 만든다. 저장소에는 두지 않는다.
# 주소 → 서비스 연결(Public hostname)은 Cloudflare 화면에서 정한다. deploy/README.md "도메인 연결" 참고.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blog
labels:
  - pairs:
      app.kubernetes.io/part-of: blog
    includeSelectors: false
resources:
  - cloudflared.yaml
