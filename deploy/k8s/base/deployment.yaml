apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-app
  labels:
    app.kubernetes.io/name: blog-app
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: blog-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # 새 파드가 준비된 뒤에만 옛 파드를 내린다
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blog-app
    spec:
      serviceAccountName: blog-app
      # GHCR 비공개 이미지를 받는 Secret (deploy.yml이 만든다). 없으면 노드에 이미 있는 이미지로 뜬다(로컬 검증)
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: blog-app
      containers:
        - name: app
          image: blog-app
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # 접속 정보는 전부 환경 변수로만 받는다 (/mnt/project-files/infra/app-env-vars.md 이름 기준).
          envFrom:
            - configMapRef:
                name: blog-app-config
            - secretRef:
                name: blog-app-secret
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp"
            - name: SERVER_SHUTDOWN
              value: graceful
            - name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE
              value: 30s
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          # Spring Boot는 쿠버네티스 안에서 liveness·readiness 경로를 자동으로 연다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36   # Flyway 마이그레이션 포함 최대 3분
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # 인그레스가 이 파드를 목록에서 뺄 시간을 준다
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
