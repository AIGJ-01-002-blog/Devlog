# 블로그 앱 공통 배포 구성. 환경별 값(주소·비밀값)은 overlays/에서 넣는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blog
labels:
  - pairs:
      app.kubernetes.io/part-of: blog
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  - name: blog-app
    newName: ghcr.io/aigj-01-002-blog/blog-app
    newTag: latest
