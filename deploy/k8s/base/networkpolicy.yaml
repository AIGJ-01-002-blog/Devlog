# 앱으로 들어오는 요청은 인그레스 컨트롤러에서만 받는다.
# 나가는 연결(DB·Redis·MinIO 등 학교 공용 서버)은 막지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blog-app-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blog-app
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
