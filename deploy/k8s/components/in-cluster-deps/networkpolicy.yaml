# 클러스터 안 데이터 서비스는 앱 파드에서만 접속한다. MinIO는 사진을 내려주려고 인그레스 컨트롤러도 받는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deps-from-app
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [postgres, redis]}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blog-app
    # 매일 DB 백업(pg-backup)은 PostgreSQL에만 접속한다
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pg-backup
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-from-app-and-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blog-app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 9000
