# 학교 NHN 공용 인프라(PostgreSQL·Redis·MinIO·RabbitMQ·Elasticsearch·Ollama)를 쓰는 배포.
# 비밀값은 secret.env(커밋 금지, .gitignore)에서 읽는다. 형식은 secret.env.example 참고.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blog
resources:
  - ../../base
configMapGenerator:
  - name: blog-app-config
    envs: [app.env]
secretGenerator:
  - name: blog-app-secret
    envs: [secret.env]
patches:
  - target:
      kind: Ingress
      name: blog-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: blog.example.com
