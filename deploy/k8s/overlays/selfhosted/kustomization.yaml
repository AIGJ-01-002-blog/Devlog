# 학교 공용 서버에 닿지 않을 때 쓰는 운영 구성 (2026-10-07: 학교 서버는 외부망에서 MinIO 말고 닫혀 있음).
# PostgreSQL·Redis·MinIO를 클러스터 안에 영구 볼륨과 함께 띄운다. 학교 인프라가 열리면 overlays/nhn으로 바꾼다.
# 비밀값은 secret.env(커밋 금지)에서 읽는다. deploy/scripts/gen-secret-env.sh가 임의 값으로 만들어 준다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blog
labels:
  - pairs:
      app.kubernetes.io/part-of: blog
    includeSelectors: false
resources:
  - ../../base
components:
  - ../../components/in-cluster-deps
configMapGenerator:
  - name: blog-app-config
    envs: [app.env]
secretGenerator:
  - name: blog-app-secret
    envs: [secret.env]
patches:
  - target:
      kind: Ingress
      name: blog-app
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: devlog.life
